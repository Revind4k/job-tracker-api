# Local stack: API + Postgres + Redis.  docker compose up --build
services:
  api:
    build: .
    ports: ["8080:8080"]
    environment:
      DB_URL: jdbc:postgresql://db:5432/jobtracker
      DB_USER: jobtracker
      DB_PASSWORD: jobtracker
      REDIS_HOST: redis
      JWT_SECRET: local-compose-secret-change-me-0123456789
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: jobtracker
      POSTGRES_USER: jobtracker
      POSTGRES_PASSWORD: jobtracker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtracker"]
      interval: 2s
      retries: 20
  redis:
    image: redis:8
