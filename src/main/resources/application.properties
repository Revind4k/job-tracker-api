spring.application.name=job-tracker-api
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jobtracker}
spring.datasource.username=${DB_USER:${USER}}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=${CACHE_TYPE:redis}
spring.cache.redis.time-to-live=10m
management.endpoints.web.exposure.include=health,info,metrics
# HMAC secret for signing JWTs. Must be at least 32 bytes; set JWT_SECRET in every real deployment.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
app.jwt.ttl-minutes=60
app.rate-limit.requests-per-minute=${RATE_LIMIT_RPM:120}
