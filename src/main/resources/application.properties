spring.application.name=job-tracker-api
# Render (and most PaaS) inject PORT.
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jobtracker}
spring.datasource.username=${DB_USER:${USER}}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
# Short timeouts: the rate limiter fails open when Redis is down, but with Lettuce's defaults
# "failing open" meant waiting ~10 s on every request first.
spring.data.redis.timeout=${REDIS_TIMEOUT:500ms}
spring.data.redis.connect-timeout=${REDIS_TIMEOUT:500ms}
spring.cache.type=${CACHE_TYPE:redis}
spring.cache.redis.time-to-live=10m
management.endpoints.web.exposure.include=health,info,metrics
# Without Redis (REDIS_ENABLED=false) the health check must not report DOWN, or the platform
# would keep restarting a perfectly working API.
management.health.redis.enabled=${REDIS_ENABLED:true}
# HMAC secret for signing JWTs. Must be at least 32 bytes; set JWT_SECRET in every real deployment.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
app.jwt.ttl-minutes=60
app.rate-limit.requests-per-minute=${RATE_LIMIT_RPM:120}
app.rate-limit.enabled=${REDIS_ENABLED:true}
# Comma-separated browser origins allowed to call the API (the React app).
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
